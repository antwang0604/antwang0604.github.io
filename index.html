<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthony Wang — Portfolio</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --accent: #2b5fd9;
    --border: #e4e4e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #f0f0f0;
      --muted: #a0a0a0;
      --accent: #6c9bff;
      --border: #2a2a2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 2rem 1.5rem 1.25rem;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  header h1 {
    margin: 0 0 0.35rem;
    font-size: 1.6rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
  }
  .actions {
    margin-top: 1rem;
  }
  .actions a {
    display: inline-block;
    padding: 0.55rem 1.1rem;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.95rem;
    border: 1px solid var(--accent);
    color: var(--accent);
    margin: 0 0.3rem;
  }
  .actions a.primary {
    background: var(--accent);
    color: #fff;
  }
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 1.25rem;
  }
  .pdf-wrap {
    width: 100%;
    max-width: 1000px;
    height: 85vh;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .pdf-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  footer {
    text-align: center;
    padding: 1rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Anthony Wang</h1>
    <p>Portfolio</p>
    <div class="actions">
      <a class="primary" href="portfolio.pdf" target="_blank" rel="noopener">View fullscreen</a>
      <a href="portfolio.pdf" download>Download PDF</a>
    </div>
  </header>
  <main>
    <div class="pdf-wrap">
      <iframe src="portfolio.pdf" title="Portfolio PDF"></iframe>
    </div>
  </main>
  <footer>
    &copy; <span id="year"></span> Anthony Wang
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
